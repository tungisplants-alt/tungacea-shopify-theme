<!doctype html>
<html lang="en" class="js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password preview — Anthurium candidate</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/section-image-banner.css">
<link rel="stylesheet" href="assets/component-newsletter.css">
<link rel="stylesheet" href="assets/newsletter-section.css">
<link rel="stylesheet" href="assets/section-email-signup-banner.css">
<link rel="stylesheet" href="assets/section-password.css">
<link rel="stylesheet" href="assets/password-hero-video.css">
<style>
  :root{
    --color-foreground:242 238 232;
    --color-background:10 10 10;
    --color-link:242 238 232;
    --font-body-scale:1;
    --font-heading-scale:1;
    --page-width:120rem;
    --font-body-family:Georgia, 'Times New Roman', serif;
    --font-heading-family:Georgia, 'Times New Roman', serif;
    --font-body-style:normal;--font-body-weight:400;
    --tungacea-accent-bright:168, 52, 66;
    --tungacea-muted:rgba(185,178,169,0.78);
    --tungacea-hairline-accent:rgba(110,28,40,0.32);
    --buttons-radius:0;--inputs-radius:0;--media-radius:0;
    --gradient-background:#0a0a0a;
  }
  html,body{margin:0;background:#0a0a0a;color:rgb(242 238 232);min-height:100vh;}
  /* password template forces the hero to fill the viewport — reproduce that */
  body{display:flex;flex-direction:column;}
  .password-main{flex-grow:1;display:flex;}
  .password-main .section{flex:1 1 auto;display:flex;}
  .password-main .banner{flex:1 1 auto;min-height:100vh;}
  /* video-state debug badge (preview only) */
  #vstate{position:fixed;left:10px;bottom:10px;z-index:9999;font:12px/1.5 monospace;
    background:rgba(0,0,0,.72);color:#9fe870;padding:10px 12px;border:1px solid #2b2b2b;border-radius:6px;max-width:46ch;}
  #vstate b{color:#fff;}
</style>
</head>
<body class="password gradient">
  <div class="password-main">
    <section class="section">
      <div id="Banner-preview"
        class="email-signup-banner banner banner--content-align-center banner--content-align-mobile-center banner--medium banner--mobile-bottom">
        <div class="banner__media media">
          <video
            class="banner__media-image tungacea-default-media tungacea-hero-video"
            poster="assets/anthurium-360-poster.jpg"
            autoplay muted loop playsinline preload="auto"
            width="1080" height="1920" aria-hidden="true"
            disablepictureinpicture disableremoteplayback tabindex="-1"
            data-testid="password-hero-video">
            <source src="exports/anthurium-candidate-native-crf23.mp4" type="video/mp4">
          </video>
        </div>
        <div class="banner__content banner__content--middle-center page-width">
          <div class="email-signup-banner__box banner__box newsletter newsletter__wrapper isolate content-container color-scheme-1 gradient content-container--full-width-mobile">
            <p class="email-signup-banner__eyebrow caption-with-letter-spacing">Private access</p>
            <h2 class="email-signup-banner__heading h1">The collection is resting.</h2>
            <div class="newsletter__subheading rte body">
              <p>Join the collectors list for early access to the next Anthurium release.</p>
            </div>
            <div class="newsletter-form__field-wrapper">
              <div class="field">
                <input type="email" class="field__input" placeholder="Email" value="">
                <label class="field__label">Email</label>
              </div>
            </div>
            <div class="email-signup-banner__meta">
              <span class="email-signup-banner__note">Collectors list · Early access</span>
              <a class="email-signup-banner__ig link" href="#">@tungacea</a>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>

  <div id="vstate" data-testid="video-state">initialising…</div>
  <script src="assets/password-hero-video.js" defer></script>
  <script>
    (function(){
      var v=document.querySelector('.tungacea-hero-video');
      var box=document.getElementById('vstate');
      function render(){
        box.innerHTML =
          '<b>candidate crf23</b> | '+v.videoWidth+'x'+v.videoHeight+'<br>'+
          'playing: <b>'+(!v.paused && !v.ended && v.currentTime>0)+'</b> (t='+v.currentTime.toFixed(2)+'s)<br>'+
          'muted: <b>'+v.muted+'</b> | loop: <b>'+v.loop+'</b> | playsInline: <b>'+v.playsInline+'</b><br>'+
          'autoplay attr: <b>'+v.hasAttribute('autoplay')+'</b> | readyState: '+v.readyState;
      }
      v.addEventListener('timeupdate',render);
      v.addEventListener('playing',render);
      setInterval(render,400); render();
    })();
  </script>
</body>
</html>
