<!doctype html>
<html lang="en" class="js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password preview — Tungacea new hero video</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/section-image-banner.css">
<link rel="stylesheet" href="assets/component-newsletter.css">
<link rel="stylesheet" href="assets/newsletter-section.css">
<link rel="stylesheet" href="assets/section-email-signup-banner.css">
<link rel="stylesheet" href="assets/section-password.css">
<link rel="stylesheet" href="assets/password-hero-image.css">
<style>
  :root{
    --color-foreground:242 238 232;
    --color-background:10 10 10;
    --color-link:242 238 232;
    --font-body-scale:1;
    --font-heading-scale:1;
    --page-width:120rem;
    --page-width-margin:2rem;
    --font-body-family:Georgia, 'Times New Roman', serif;
    --font-heading-family:Georgia, 'Times New Roman', serif;
    --font-body-style:normal;--font-body-weight:400;
    --tungacea-accent-bright:168, 52, 66;
    --tungacea-muted:rgba(185,178,169,0.78);
    --tungacea-hairline-accent:rgba(110,28,40,0.32);
    --buttons-radius:0;--inputs-radius:0;--media-radius:0;
    --gradient-background:#0a0a0a;
  }
  html,body{margin:0;background:#0a0a0a;color:rgb(242 238 232);min-height:100vh;}
  body{display:flex;flex-direction:column;}
  /* mimic layout/password.liquid header + footer height so the hero band ratio matches production */
  .fake-header{height:96px;flex:0 0 auto;border-bottom:1px solid rgba(255,255,255,.06);}
  .fake-footer{height:80px;flex:0 0 auto;}
  .password-main{flex-grow:1;display:flex;}
  .password-main .section{flex:1 1 auto;display:flex;}
  .password-main .banner{flex:1 1 auto;}
  @media (min-width:750px){ .password-main .banner{min-height:calc(100vh - 176px);} }
</style>
</head>
<body class="password gradient">
  <div class="fake-header"></div>
  <main class="password-main">
    <section class="section">
      <div id="Banner-preview"
        class="email-signup-banner banner banner--content-align-left banner--content-align-mobile-left banner--large banner--desktop-transparent">
        <div class="banner__media">
          <img
            class="banner__media-image tungacea-default-media tungacea-hero-image"
            src="assets/tungacea-password-hero.jpg"
            alt="Tungacea"
            width="1080" height="1920"
            data-testid="password-hero-image">
        </div>
        <div class="banner__content banner__content--middle-left page-width">
          <div class="email-signup-banner__box banner__box newsletter newsletter__wrapper isolate content-container color-scheme-1 gradient content-container--full-width-mobile">
            <p class="email-signup-banner__eyebrow caption-with-letter-spacing">Private access</p>
            <h2 class="email-signup-banner__heading h0">Enter the Tungacea collection.</h2>
            <div class="newsletter__subheading rte body">
              <p>Rare Anthuriums, selected genetics and dark botanical specimens. Join the list for early access, drops and collector updates.</p>
            </div>
            <div class="newsletter-form__field-wrapper">
              <div class="field">
                <input type="email" class="field__input" placeholder="Email" value="">
                <label class="field__label">Email</label>
              </div>
            </div>
            <div class="email-signup-banner__meta">
              <span class="email-signup-banner__note">Collectors list · Early access</span>
              <a class="email-signup-banner__ig link" href="#">@tungacea</a>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>
  <div class="fake-footer"></div>
</body>
</html>
