<!doctype html><html lang="de"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400&family=Cormorant:wght@400&display=swap" rel="stylesheet">
<style>
  html{font-size:62.5%}
  body{margin:0;background:#0a0a0a;color:#f2eee8;font-family:'Jost',sans-serif;font-size:1.6rem}
  .shell{padding:3.4rem 3.4rem 4rem}
  h1{font-family:'Cormorant',serif;font-weight:400;font-size:2.8rem;margin:0 0 .4rem}
  .intro{color:rgba(205,198,188,.85);font-size:1.35rem;margin:0 0 2.8rem;max-width:90ch;line-height:1.6}
  .reihe{display:flex;gap:3rem}
  .sp{flex:1}
  .titel{font-family:'Cormorant',serif;font-size:1.9rem;margin:0 0 1rem}
  .gross img{width:100%;display:block}
  .klein{display:flex;align-items:flex-end;gap:1.4rem;margin-top:1.6rem}
  .klein figure{margin:0}
  .klein img{display:block}
  .klein figcaption{font-size:.95rem;letter-spacing:.14em;text-transform:uppercase;
    color:rgba(205,198,188,.5);margin-top:.6rem}
  .weiss{background:#fff;padding:1.1rem;display:inline-block}
</style></head><body><div class="shell">
<h1>Winterverpackung — Piktogramme</h1>
<p class="intro">Groß, dann bei 150&nbsp;px (Warenkorbzeile), bei 56&nbsp;px und auf Weiß wie im Checkout.</p>
<div class="reihe">
  <div class="sp">
    <p class="titel">A — Heatpack</p>
    <div class="gross"><img src="pikto-a.svg" alt=""></div>
    <div class="klein">
      <figure><img src="pikto-a.svg" width="150" height="150"><figcaption>150 px</figcaption></figure>
      <figure><img src="pikto-a.svg" width="56" height="56"><figcaption>56 px</figcaption></figure>
      <figure><span class="weiss"><img src="pikto-a.svg" width="96" height="96"></span><figcaption>auf Weiß</figcaption></figure>
    </div>
  </div>
  <div class="sp">
    <p class="titel">B — Frostsymbol</p>
    <div class="gross"><img src="pikto-b.svg" alt=""></div>
    <div class="klein">
      <figure><img src="pikto-b.svg" width="150" height="150"><figcaption>150 px</figcaption></figure>
      <figure><img src="pikto-b.svg" width="56" height="56"><figcaption>56 px</figcaption></figure>
      <figure><span class="weiss"><img src="pikto-b.svg" width="96" height="96"></span><figcaption>auf Weiß</figcaption></figure>
    </div>
  </div>
  <div class="sp">
    <p class="titel">C — Wärme gegen Frost</p>
    <div class="gross"><img src="pikto-c.svg" alt=""></div>
    <div class="klein">
      <figure><img src="pikto-c.svg" width="150" height="150"><figcaption>150 px</figcaption></figure>
      <figure><img src="pikto-c.svg" width="56" height="56"><figcaption>56 px</figcaption></figure>
      <figure><span class="weiss"><img src="pikto-c.svg" width="96" height="96"></span><figcaption>auf Weiß</figcaption></figure>
    </div>
  </div>
  <div class="sp">
    <p class="titel">D — Heatpack in Isolierfolie</p>
    <div class="gross"><img src="pikto-d.svg" alt=""></div>
    <div class="klein">
      <figure><img src="pikto-d.svg" width="150" height="150"><figcaption>150 px</figcaption></figure>
      <figure><img src="pikto-d.svg" width="56" height="56"><figcaption>56 px</figcaption></figure>
      <figure><span class="weiss"><img src="pikto-d.svg" width="96" height="96"></span><figcaption>auf Weiß</figcaption></figure>
    </div>
  </div>
</div></div></body></html>
