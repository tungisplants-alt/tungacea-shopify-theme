<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>iPhone preview frame</title>
<style>
  html,body{margin:0;height:100%;background:#161616;display:flex;align-items:center;justify-content:center;font:13px monospace;color:#ccc;}
  .wrap{display:flex;flex-direction:column;align-items:center;gap:10px;}
  .phone{width:390px;height:760px;border:12px solid #000;border-radius:44px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.6);background:#000;}
  iframe{width:390px;height:736px;border:0;display:block;}
  .cap{color:#8a8;}
</style>
</head>
<body>
  <div class="wrap">
    <div class="cap">iPhone (390 × 844 CSS px) — real mobile crop of password page · candidate crf23</div>
    <div class="phone">
      <iframe src="preview-password.html" title="mobile"></iframe>
    </div>
  </div>
</body>
</html>
